  buffer_size: 10%
  on_idle:
    timeout: !lambda "return (id(display_timeout).state * 1000);"
    then:
      - logger.log: "LVGL idle - display off"
      - light.turn_off: backlight
      - lvgl.pause
  disp_bg_color: black
  widgets:
