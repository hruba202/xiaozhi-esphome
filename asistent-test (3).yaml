touchscreen:
  platform: gt911
  id: touch
  address: 0x5D
  i2c_id: bus_a
  on_touch:
    then:
      - light.turn_on: backlight

  on_release:
    - if:
        condition: lvgl.is_paused
        then:
          - lvgl.resume
          - light.turn_on: backlight

output:
  - platform: template
    id: stc8h_backlight_output
    type: float
    write_action:
      - lambda: |-
          uint8_t command;
          if (state <= 0.0f) {
            command = 245;
          } else {
            command = (uint8_t) roundf((1.0f - state) * 244.0f);
          }
          uint8_t cmd[1] = { command };
          id(bus_a).write(0x30, cmd, 1);
          ESP_LOGD("backlight", "State: %.2f | Brightness command: %d", state, command);

  - platform: template
    id: backlight_output
    type: binary
    write_action:
      - lambda: |-
          uint8_t config_reg = 0x03;
          uint8_t config_data = 0xFD;
          id(pca9557_device).write_byte(config_reg, config_data);
          delay(10);
          uint8_t output_reg = 0x01;
          uint8_t output_data = state ? 0x02 : 0x00;
          id(pca9557_device).write_byte(output_reg, output_data);



light:
  - platform: monochromatic
    name: "Asistent23 Backlight"
    id: backlight
    output: stc8h_backlight_output
    internal: false
    restore_mode: ALWAYS_ON

display:
